<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קופסת המתכונים — בישלת, צילמת, שיתפת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc; --paper2:#efe4cd; --card:#fffdf6; --ink:#2e2620; --ink-soft:#6d5f52;
  --terra:#c0532b; --terra-deep:#9c3f1f; --green:#46614a; --blue-line:#b8cfe0; --red-line:#e0a493;
  --tape:rgba(240,214,140,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Heebo',sans-serif;color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.5), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(120,90,60,.045) 34px 35px);
  min-height:100vh;
}
h1,h2,h3,.brand,.btn,.stamp{font-family:'Secular One','Heebo',sans-serif}
a{color:var(--terra-deep)}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px clamp(16px,5vw,48px);border-bottom:3px solid var(--ink);
  background:linear-gradient(180deg,var(--paper2),var(--paper));
  position:sticky;top:0;z-index:10;
}
.brand{font-size:clamp(22px,4vw,32px);display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .box{font-size:.85em}
.tagline{font-size:12px;color:var(--ink-soft);margin-top:2px}
.stamp{
  display:inline-block;background:var(--terra);color:#fff;padding:4px 12px;border-radius:4px;
  transform:rotate(-3deg);font-size:13px;box-shadow:2px 2px 0 rgba(0,0,0,.18);
}
nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{
  border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 18px;
  border-radius:6px;cursor:pointer;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s, box-shadow .08s;text-decoration:none;display:inline-block;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--terra);color:#fff;border-color:var(--terra-deep);box-shadow:3px 3px 0 var(--terra-deep)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
main{max-width:1060px;margin:0 auto;padding:28px clamp(14px,4vw,40px) 80px}
/* ---- feed: recipe cards in the box ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px;margin-top:26px}
.rcard{
  background:var(--card);border:1.5px solid #d8cdb4;border-radius:3px;padding:14px 16px 18px;
  box-shadow:4px 6px 14px rgba(80,60,30,.16);position:relative;cursor:pointer;
  background-image:repeating-linear-gradient(0deg, transparent 0 27px, var(--blue-line) 27px 28px);
  transition:transform .15s;
}
.rcard::before{ /* red margin line */
  content:"";position:absolute;top:0;bottom:0;right:34px;width:1.5px;background:var(--red-line);opacity:.7;
}
.rcard:nth-child(odd){transform:rotate(-1.1deg)}
.rcard:nth-child(even){transform:rotate(.9deg)}
.rcard:hover{transform:rotate(0) scale(1.02);z-index:2}
.rcard .photo{
  margin:6px 0 12px;position:relative;transform:rotate(-1.5deg);
}
.rcard:nth-child(even) .photo{transform:rotate(1.4deg)}
.rcard .photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:5px solid #fff;box-shadow:2px 3px 8px rgba(0,0,0,.25)}
.rcard .photo::after{ /* washi tape */
  content:"";position:absolute;top:-11px;right:50%;transform:translateX(50%) rotate(-2deg);
  width:78px;height:22px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.15);
  clip-path:polygon(2% 0,98% 4%,100% 96%,0 100%);
}
.rcard h3{font-size:20px;line-height:28px;min-height:28px}
.rcard .by{font-size:13px;color:var(--ink-soft);line-height:28px}
.rcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;line-height:28px}
.rcard .count{
  background:var(--green);color:#fff;font-size:12px;padding:2px 10px;border-radius:20px;font-weight:700;
}
.empty{
  text-align:center;padding:70px 20px;border:2px dashed #c9b892;border-radius:12px;margin-top:30px;
  background:rgba(255,253,246,.5);
}
.empty h2{font-size:26px;margin-bottom:10px}
/* ---- recipe detail ---- */
.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;margin-top:24px}
@media(max-width:820px){.detail{grid-template-columns:1fr}}
.polaroid{
  background:#fff;padding:14px 14px 46px;box-shadow:5px 8px 20px rgba(80,60,30,.25);
  transform:rotate(-1.6deg);position:relative;
}
.polaroid::after{
  content:"";position:absolute;top:-12px;right:50%;transform:translateX(50%) rotate(2deg);
  width:110px;height:26px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.polaroid img{width:100%;display:block}
.recipe-sheet{
  background:var(--card);border:1.5px solid #d8cdb4;padding:22px 26px;border-radius:3px;
  box-shadow:4px 6px 14px rgba(80,60,30,.16);position:relative;
  background-image:repeating-linear-gradient(0deg, transparent 0 27px, var(--blue-line) 27px 28px);
}
.recipe-sheet::before{content:"";position:absolute;top:0;bottom:0;right:40px;width:1.5px;background:var(--red-line);opacity:.7}
.recipe-sheet h2{font-size:30px;line-height:28px;margin-bottom:6px}
.recipe-sheet h4{color:var(--terra-deep);font-family:'Secular One';margin:16px 0 4px;font-size:17px}
.recipe-sheet .txt{white-space:pre-wrap;line-height:28px;font-size:15px}
.responses{margin-top:44px}
.responses h3{font-size:24px;display:flex;align-items:center;gap:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px;margin-top:18px}
.rshot{
  background:#fff;padding:9px 9px 30px;box-shadow:3px 5px 12px rgba(80,60,30,.22);position:relative;
}
.rshot:nth-child(odd){transform:rotate(-1.4deg)}
.rshot:nth-child(even){transform:rotate(1.2deg)}
.rshot img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.rshot figcaption{font-size:12px;color:var(--ink-soft);margin-top:7px;text-align:center}
/* ---- forms ---- */
.panel{
  max-width:480px;margin:40px auto;background:var(--card);border:1.5px solid #d8cdb4;border-radius:4px;
  padding:30px 30px 34px;box-shadow:5px 7px 18px rgba(80,60,30,.18);position:relative;
}
.panel::before{
  content:"";position:absolute;top:-13px;right:50%;transform:translateX(50%) rotate(-2deg);
  width:120px;height:26px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.panel h2{font-size:26px;margin-bottom:16px;text-align:center}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input[type=text],input[type=password],textarea{
  width:100%;padding:9px 12px;border:1.5px solid #c9b892;border-radius:5px;background:#fffef9;
  font-family:'Heebo';font-size:15px;color:var(--ink);
}
textarea{resize:vertical;min-height:90px}
input[type=file]{width:100%;font-size:13px;margin-top:4px}
.photo-picker{margin-top:7px;border:2px dashed #c9b892;background:#fffef9;padding:10px;border-radius:8px;transition:border-color .15s,background .15s}
.photo-picker:focus-within{border-color:var(--terra);background:#fff}
.photo-preview{display:none;margin-top:10px;grid-template-columns:92px 1fr;gap:12px;align-items:center;text-align:right}
.photo-preview.show{display:grid}
.photo-preview img{width:92px;height:76px;object-fit:cover;border:4px solid #fff;box-shadow:2px 3px 8px rgba(80,60,30,.22);transform:rotate(-1.5deg)}
.photo-preview .pname{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.photo-preview .pmeta{color:var(--ink-soft);font-size:12px;margin-top:3px}
.photo-preview .ready{color:var(--green);font-size:12px;font-weight:700;margin-top:4px}
.roles{display:flex;gap:10px;margin-top:6px}
.role-chip{
  flex:1;border:2px solid var(--ink);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;
  background:#fffef9;transition:all .1s;
}
.role-chip.sel{background:var(--terra);color:#fff;border-color:var(--terra-deep);box-shadow:2px 2px 0 var(--terra-deep)}
.role-chip .big{font-family:'Secular One';font-size:17px}
.role-chip .small{font-size:12px;opacity:.85}
.err{background:#fbe3dc;border:1.5px solid var(--terra);color:var(--terra-deep);padding:9px 12px;border-radius:6px;margin-top:12px;font-size:14px}
.ok{background:#e4efe2;border:1.5px solid var(--green);color:var(--green);padding:9px 12px;border-radius:6px;margin-top:12px;font-size:14px}
.panel .btn{width:100%;margin-top:20px}
.switchline{text-align:center;margin-top:16px;font-size:14px;color:var(--ink-soft)}
.me-badge{font-size:13px;color:var(--ink-soft)}
.me-badge b{color:var(--ink)}
.hero{
  text-align:center;padding:34px 16px 8px;
}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.15}
.hero p{color:var(--ink-soft);margin-top:10px;font-size:16px}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--ink-soft);font-size:12px;padding:30px;border-top:1.5px dashed #c9b892}
@media(max-width:640px){
  header{padding:14px 14px}
  .brand{font-size:20px}
  .btn{padding:7px 12px;font-size:14px}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand" onclick="go('feed')">🗃️ <span>קופסת המתכונים</span></div>
    <div class="tagline">יוצרים מעלים מתכון · מגיבים מעלים תמונה של מה שהכינו</div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>קופסת המתכונים · נבנה באהבה ובחינם · גרסה ראשונה</footer>
<script>
let ME = null;
const $ = s => document.querySelector(s);
const app = $('#app');

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'שגיאה');
  return data;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgUrl(k){return '/img/'+k}

// downscale photo client-side before upload (keeps storage tiny on free tier)
function shrink(file, max=1600){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max/Math.max(img.width,img.height));
      if(scale===1 && file.size < 2*1024*1024){ resolve(file); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{
        if(!b) return reject(new Error('בעיה בעיבוד התמונה'));
        resolve(new File([b],'photo.jpg',{type:'image/jpeg'}));
      },'image/jpeg',0.85);
    };
    img.onerror = ()=>reject(new Error('הקובץ אינו תמונה תקינה'));
    img.src = URL.createObjectURL(file);
  });
}

function bindPhotoPreview(inputId, previewId){
  const input = $('#'+inputId), box = $('#'+previewId);
  if(!input || !box) return;
  input.addEventListener('change', ()=>{
    const f = input.files && input.files[0];
    if(!f){ box.classList.remove('show'); box.innerHTML=''; return; }
    if(!['image/jpeg','image/png','image/webp'].includes(f.type)){
      box.classList.add('show'); box.innerHTML='<div></div><div class="err">אפשר לבחור JPG, PNG או WebP בלבד</div>'; return;
    }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = ()=>{
      box.classList.add('show');
      box.innerHTML='<img src="'+url+'" alt="תצוגה מקדימה"><div><div class="pname">'+esc(f.name)+'</div><div class="pmeta">'+img.width+'×'+img.height+' · '+(f.size/1024/1024).toFixed(1)+' MB</div><div class="ready">התמונה מוכנה · תכווץ אוטומטית לפני ההעלאה</div></div>';
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); box.classList.add('show'); box.innerHTML='<div></div><div class="err">לא הצלחנו לקרוא את התמונה</div>'; };
    img.src=url;
  });
}

function renderNav(){
  const nav = $('#nav');
  if(!ME){
    nav.innerHTML = `<button class="btn primary" onclick="go('auth')">כניסה / הרשמה</button>`;
  } else {
    const roleName = ME.role==='creator' ? 'יוצר/ת' : 'מגיב/ה';
    nav.innerHTML = `
      <span class="me-badge">שלום, <b>${esc(ME.name)}</b> (${roleName})</span>
      ${ME.role==='creator' ? `<button class="btn primary" onclick="go('new')">+ מתכון חדש</button>` : ''}
      <button class="btn ghost" onclick="logout()">יציאה</button>`;
  }
}

async function go(view, arg){
  renderNav();
  if(view==='feed') return renderFeed();
  if(view==='auth') return renderAuth();
  if(view==='new') return renderNew();
  if(view==='recipe') return renderRecipe(arg);
}

async function renderFeed(){
  app.innerHTML = `<div class="hero"><h1>כל מתכון הוא קלף בקופסה</h1>
    <p>יוצרים מעלים קלף מתכון עם תמונה והוראות. מגיבים מכינים בבית — ומדביקים תמונה של מה שיצא.</p>
    ${!ME?`<div style="margin-top:18px"><button class="btn primary" onclick="go('auth')">הצטרפו לקופסה</button></div>`:''}
  </div><div id="feed"><div class="empty">טוען קלפים…</div></div>`;
  const {recipes} = await api('/api/recipes');
  const feed = $('#feed');
  if(!recipes.length){
    feed.innerHTML = `<div class="empty"><h2>הקופסה עוד ריקה</h2><p>המתכון הראשון מחכה ליוצר הראשון.</p></div>`;
    return;
  }
  feed.innerHTML = `<div class="grid">` + recipes.map(r=>`
    <article class="rcard" onclick="go('recipe','${r.id}')">
      <div class="photo"><img loading="lazy" src="${imgUrl(r.photo_key)}" alt="${esc(r.title)}"></div>
      <h3>${esc(r.title)}</h3>
      <div class="by">מאת ${esc(r.creator_name)}</div>
      <div class="meta">
        <span class="count">${r.response_count} הכינו</span>
        <span style="font-size:12px;color:var(--ink-soft)">${new Date(r.created_at+'Z').toLocaleDateString('he-IL')}</span>
      </div>
    </article>`).join('') + `</div>`;
}

function renderAuth(mode='signup'){
  app.innerHTML = `
  <div class="panel">
    <h2>${mode==='signup'?'פתיחת קלף אישי':'כניסה לקופסה'}</h2>
    ${mode==='signup' ? `
    <label>מי את/ה בקופסה?</label>
    <div class="roles">
      <div class="role-chip ${window._role==='creator'?'sel':''}" id="chip-creator" onclick="pickRole('creator')">
        <div class="big">🧑‍🍳 יוצר/ת</div><div class="small">מעלה מתכונים עם הוראות</div>
      </div>
      <div class="role-chip ${window._role==='responder'?'sel':''}" id="chip-responder" onclick="pickRole('responder')">
        <div class="big">🍳 מגיב/ה</div><div class="small">מכין/ה ומעלה תמונה</div>
      </div>
    </div>` : ''}
    <label>שם</label>
    <input type="text" id="f-name" maxlength="40" placeholder="השם שיופיע על הקלפים שלך">
    <label>סיסמה</label>
    <input type="password" id="f-pass" placeholder="לפחות 4 תווים">
    <div id="auth-msg"></div>
    <button class="btn primary" id="auth-btn" onclick="doAuth('${mode}')">${mode==='signup'?'צרו לי קלף':'כניסה'}</button>
    <div class="switchline">
      ${mode==='signup'
        ? `יש לך כבר קלף? <a href="#" onclick="renderAuth('login');return false">כניסה</a>`
        : `חדשים כאן? <a href="#" onclick="renderAuth('signup');return false">הרשמה</a>`}
    </div>
  </div>`;
  if(!window._role) pickRole('creator');
}
function pickRole(r){
  window._role = r;
  document.querySelectorAll('.role-chip').forEach(c=>c.classList.remove('sel'));
  const chip = $('#chip-'+r); if(chip) chip.classList.add('sel');
}
async function doAuth(mode){
  const msg = $('#auth-msg'); msg.innerHTML='';
  const btn = $('#auth-btn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try{
    const body = {name: $('#f-name').value.trim(), password: $('#f-pass').value};
    if(mode==='signup') body.role = window._role || 'creator';
    const data = await api('/api/'+mode, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    ME = data.user;
    go('feed');
  }catch(e){
    msg.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    btn.disabled = false; btn.textContent = mode==='signup'?'צרו לי קלף':'כניסה';
  }
}
async function logout(){
  await api('/api/logout',{method:'POST'});
  ME = null; go('feed');
}

function renderNew(){
  if(!ME || ME.role!=='creator'){ return renderAuth('login'); }
  app.innerHTML = `
  <div class="panel" style="max-width:560px">
    <h2>קלף מתכון חדש</h2>
    <label>שם המתכון</label>
    <input type="text" id="n-title" maxlength="120" placeholder="למשל: עוגת התפוחים של סבתא">
    <label>תמונה של המנה</label>
    <div class="photo-picker"><input type="file" id="n-photo" accept="image/jpeg,image/png,image/webp"><div class="photo-preview" id="n-preview" aria-live="polite"></div></div>
    <label>מרכיבים</label>
    <textarea id="n-ing" rows="5" placeholder="שורה לכל מרכיב…"></textarea>
    <label>הוראות הכנה</label>
    <textarea id="n-ins" rows="8" placeholder="שלב אחר שלב…"></textarea>
    <div id="new-msg"></div>
    <button class="btn primary" id="new-btn" onclick="doNew()">לתוך הקופסה</button>
  </div>`;
  bindPhotoPreview('n-photo','n-preview');
}
async function doNew(){
  const msg = $('#new-msg'); msg.innerHTML='';
  const btn = $('#new-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> מעלה…';
  try{
    const f = $('#n-photo').files[0];
    if(!f) throw new Error('צריך תמונה של המנה');
    const photo = await shrink(f);
    const fd = new FormData();
    fd.append('title', $('#n-title').value.trim());
    fd.append('ingredients', $('#n-ing').value.trim());
    fd.append('instructions', $('#n-ins').value.trim());
    fd.append('photo', photo);
    const data = await api('/api/recipes', {method:'POST', body:fd});
    go('recipe', data.id);
  }catch(e){
    msg.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    btn.disabled=false; btn.textContent='לתוך הקופסה';
  }
}

async function renderRecipe(id){
  app.innerHTML = `<div class="empty">שולף את הקלף…</div>`;
  let data;
  try{ data = await api('/api/recipes/'+id); }
  catch(e){ app.innerHTML = `<div class="empty"><h2>הקלף הלך לאיבוד</h2><p><a href="#" onclick="go('feed');return false">חזרה לקופסה</a></p></div>`; return; }
  const r = data.recipe;
  app.innerHTML = `
  <div style="margin-top:6px"><a href="#" onclick="go('feed');return false">→ חזרה לקופסה</a></div>
  <div class="detail">
    <div class="polaroid"><img src="${imgUrl(r.photo_key)}" alt="${esc(r.title)}"></div>
    <div class="recipe-sheet">
      <span class="stamp">קלף מתכון</span>
      <h2>${esc(r.title)}</h2>
      <div style="color:var(--ink-soft);font-size:14px">מאת ${esc(r.creator_name)} · ${new Date(r.created_at+'Z').toLocaleDateString('he-IL')}</div>
      <h4>מרכיבים</h4>
      <div class="txt">${esc(r.ingredients)}</div>
      <h4>הוראות הכנה</h4>
      <div class="txt">${esc(r.instructions)}</div>
    </div>
  </div>
  <section class="responses">
    <h3>🍽️ הכינו את זה בבית <span style="font-size:14px;color:var(--ink-soft);font-family:'Heebo'">(${data.responses.length})</span></h3>
    ${ME && ME.role==='responder' ? `
      <div class="panel" style="max-width:420px;margin:20px 0;text-align:right">
        <h2 style="font-size:19px">הכנתם? הדביקו תמונה</h2>
        <p style="font-size:13px;color:var(--ink-soft)">תמונה בלבד — התמונה שלכם מספרת את הסיפור.</p>
        <div class="photo-picker"><input type="file" id="r-photo" accept="image/jpeg,image/png,image/webp"><div class="photo-preview" id="r-preview" aria-live="polite"></div></div>
        <div id="r-msg"></div>
        <button class="btn primary" id="r-btn" onclick="doRespond('${r.id}')">הדבקה לקלף</button>
      </div>` : (!ME ? `<p style="margin-top:10px"><a href="#" onclick="go('auth');return false">התחברו כמגיבים</a> כדי להדביק תמונה של מה שהכנתם.</p>` : '')}
    <div class="rgrid" id="rgrid">
      ${data.responses.map(x=>`
        <figure class="rshot"><img loading="lazy" src="${imgUrl(x.photo_key)}">
        <figcaption>${esc(x.responder_name)} הכין/ה · ${new Date(x.created_at+'Z').toLocaleDateString('he-IL')}</figcaption></figure>`).join('') || '<p style="color:var(--ink-soft)">עוד אף אחד לא הדביק תמונה. מי ראשון?</p>'}
    </div>
  </section>`;
  bindPhotoPreview('r-photo','r-preview');
}
async function doRespond(id){
  const msg = $('#r-msg'); msg.innerHTML='';
  const btn = $('#r-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> מדביק…';
  try{
    const f = $('#r-photo').files[0];
    if(!f) throw new Error('צריך תמונה');
    const photo = await shrink(f);
    const fd = new FormData();
    fd.append('photo', photo);
    await api('/api/recipes/'+id+'/responses', {method:'POST', body:fd});
    renderRecipe(id);
  }catch(e){
    msg.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    btn.disabled=false; btn.textContent='הדבקה לקלף';
  }
}

(async ()=>{
  try{ const d = await api('/api/me'); ME = d.user; }catch(e){}
  go('feed');
})();
</script>
</body>
</html>
